<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fediv — les faits divers autour de vous</title>
  <meta name="description" content="Fediv : une carte des faits divers, crimes, accidents et grandes affaires de France, racontés comme dans un vieux journal.">
  <meta name="theme-color" content="#d6bf93">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fediv">
  <link rel="canonical" href="https://9wsv9ngdft-cmd.github.io/FEDIV/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Fediv">
  <meta property="og:title" content="Fediv — les faits divers autour de vous">
  <meta property="og:description" content="Grandes affaires, accidents, incendies, catastrophes : la carte des faits divers de France, à l'endroit même où ils se sont produits.">
  <meta property="og:url" content="https://9wsv9ngdft-cmd.github.io/FEDIV/">
  <meta property="og:image" content="https://9wsv9ngdft-cmd.github.io/FEDIV/icons/partage.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Fediv : une épingle de carte avec une empreinte digitale, sur un ruban de scène de crime">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&family=Special+Elite&family=Permanent+Marker&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&family=Special+Elite&family=Permanent+Marker&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://data.geopf.fr">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/style.css?v=21" rel="stylesheet">
</head>
<body>
  <!-- Écran d'ouverture -->
  <div class="splash" id="splash" role="status" aria-live="polite">
    <img src="icons/icon-192.png?v=2" alt="" width="96" height="96">
    <div class="splash-name">FEDIV</div>
    <div class="splash-gyro"></div>
    <p class="splash-text">Ouverture du dossier…</p>
  </div>

  <div id="map" role="application" aria-label="Carte des faits divers"></div>

  <!-- En-tête -->
  <header class="masthead paper">
    <button class="icon-btn" id="menuBtn" aria-label="Sommaire">☰</button>
    <div class="masthead-title">
      <h1>Fediv</h1>
      <p class="dateline" id="todayLine"></p>
    </div>
    <button class="icon-btn" id="searchBtn" aria-label="Rechercher une ville ou une affaire">⌕</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Réglages">⚙</button>
  </header>

  <!-- Recherche -->
  <div class="search-panel" id="searchPanel" hidden role="search">
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="Une ville, une adresse, une affaire…" autocomplete="off" enterkeyhint="search" aria-label="Rechercher">
      <button class="close-btn" id="searchClose" aria-label="Fermer la recherche">✕</button>
    </div>
    <ul class="search-results" id="searchResults" aria-live="polite"></ul>
  </div>

  <div class="offline-banner" id="offlineBanner" hidden role="status">Hors ligne : la carte et les archives déjà ouvertes restent consultables.</div>

  <!-- Filtres -->
  <nav class="filters">
    <div class="rubric-bar" id="rubricBar" role="group" aria-label="Rubriques"></div>
    <div class="era-bar" id="eraBar" role="group" aria-label="Époques"></div>
  </nav>

  <div class="extra-banner" id="extraBanner" hidden></div>

  <!-- Commandes de carte -->
  <div class="map-controls">
    <button class="round-btn" id="locateBtn" aria-label="Me localiser" title="Me localiser">◎</button>
    <button class="round-btn" id="randomBtn" aria-label="Une affaire au hasard" title="Une affaire au hasard">🎲</button>
    <button class="round-btn" id="heatBtn" aria-label="Carte de chaleur" title="Carte de chaleur" aria-pressed="false">🌡</button>
    <button class="round-btn" id="replayBtn" aria-label="Rejouer l’histoire" title="Rejouer l’histoire">▶</button>
    <button class="round-btn" id="torchBtn" aria-label="Lampe torche" title="Lampe torche, puis Luminol">🔦</button>
  </div>

  <!-- Lampe torche / lumière UV -->
  <div class="torch" id="torch" hidden aria-hidden="true"></div>

  <!-- Rejouer l'histoire -->
  <div class="replay-card" id="replayCard" hidden aria-live="polite">
    <span class="replay-kicker">Rejouer l’histoire</span>
    <span class="replay-year" id="replayYear">1800</span>
    <span class="replay-count" id="replayCount"></span>
    <div class="replay-bar"><span id="replayProgress"></span></div>
    <button class="btn" id="replayStop">■ Arrêter</button>
  </div>

  <!-- Bannière de circuit -->
  <div class="circuit-banner paper" id="circuitBanner" hidden></div>

  <!-- Aperçu d'un récit -->
  <article class="teaser paper" id="teaser" hidden></article>

  <!-- Chronique (panneau) -->
  <aside class="chronicle paper torn" id="chronicle">
    <button class="chronicle-handle" id="chronicleToggle" aria-label="Replier ou déplier la chronique"><span></span></button>
    <div class="chronicle-head">
      <div>
        <p class="kicker">La chronique</p>
        <h2 id="chronicleTitle">Autour de la carte</h2>
      </div>
      <p class="status" id="statusLine"></p>
    </div>
    <ol class="clippings" id="clippings"></ol>
  </aside>

  <!-- Sommaire -->
  <div class="drawer-scrim" id="menuScrim" hidden></div>
  <nav class="drawer paper" id="menu" hidden aria-label="Sommaire">
    <h2 class="drawer-title">Sommaire</h2>
    <button data-open="une"><span>📰</span><b>La Une du jour</b><small>Ce qui s'est passé un jour comme aujourd'hui</small></button>
    <button data-open="circuits"><span>🗺</span><b>Circuits</b><small>Balades thématiques autour du centre de la carte</small></button>
    <button data-open="board"><span>📌</span><b>Mon tableau d'enquête</b><small>Tes affaires épinglées, reliées par le fil rouge</small></button>
    <button data-open="carnet"><span>📒</span><b>Carnet d'enquêteur</b><small>Tes tampons et tes insignes</small></button>
    <button data-open="quiz"><span>🕵</span><b>Qui a fait le coup ?</b><small>Dix affaires anciennes à résoudre</small></button>
    <button data-open="barometer"><span>📊</span><b>Le baromètre</b><small>Délinquance enregistrée dans la commune</small></button>
    <button data-open="compass"><span>🧭</span><b>Boussole de l’enquêteur</b><small>Une flèche vers l’affaire la plus proche</small></button>
    <button data-open="stakeout"><span>🕵</span><b>La planque</b><small>Pose le téléphone, écoute les affaires du quartier</small></button>
    <button data-open="walk"><span>🚶</span><b id="walkLabel">Mode promenade</b><small>Être prévenu en passant près d'un lieu</small></button>
    <button data-open="about"><span>ℹ</span><b>À propos et sources</b><small>D'où viennent les récits</small></button>
    <button data-open="privacy"><span>🔒</span><b>Confidentialité</b><small>Ce que l'app fait (et ne fait pas) de tes données</small></button>
  </nav>

  <!-- Fenêtres plein écran -->
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-inner paper" id="sheetInner"></div>
  </section>

  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js?v=26"></script>
</body>
</html>
